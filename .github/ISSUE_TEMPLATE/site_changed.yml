name: Site changed / selectors broke
description: Flippa changed something and the parser no longer matches.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most common way a scraper stops working, and it is worth its
        own report because the fix is different from a code bug: something on
        flippa.com moved.

        Useful to know before filing: the parser reads the listing cards in
        the served HTML (`<li id="listing-NNN">`) and the site's own result
        count ("Show 676 results" in the filter panel). There is no
        structured listing data on the page to fall back on.

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped matching
      options:
        - Listings (0 rows on a page that visibly has listings)
        - A specific field is null or wrong (price, profit, country, multiple)
        - Pagination stops early, repeats a page, or the run reports
          "pagination_not_addressable"
        - The captcha detector finds nothing on a page that has one
        - Something else
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: The exact listing URL you ran.
      placeholder: "https://flippa.com/search?filter%5Bproperty_type%5D=saas"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence from the page
      description: |
        Whichever of these you can get. A capture beats a description.

        - Run with `--dump-html dump.html`, then:
          `python3 -c "import product_parser as p; h=open('dump.html').read(); print(p.count_cards(h), p.results_count(h), len(p.parse_products(h, 'https://flippa.com/search')))"`
          — that is (cards found, the site's own match count, rows parsed).
        - Or paste the outer HTML of one listing card from devtools.
        - For a field problem: the value you got, and the value on the page.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, and when it last worked.
